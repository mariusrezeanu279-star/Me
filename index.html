<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Creative Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    .message { white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 640px) { select, button, textarea { font-size: 16px; } }
    .sidebar { width: 260px; transition: transform 0.2s; }
    .cost-badge-free { background: #16a34a20; color: #4ade80; }
    .cost-badge-credits { background: #f59e0b20; color: #fbbf24; }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased flex h-screen overflow-hidden">
  
  <button id="sidebarToggle" class="fixed top-3 left-3 z-50 bg-gray-800 p-2 rounded-md lg:hidden">
    <i class="fas fa-bars text-xl"></i>
  </button>

  <aside id="sidebar" class="sidebar bg-gray-900 border-r border-gray-800 flex flex-col h-screen overflow-y-auto fixed inset-y-0 left-0 z-40 -translate-x-full transition-transform duration-200">
    <div class="p-4 border-b border-gray-800">
      <h2 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">AI Studio</h2>
    </div>
    <nav class="flex-1 p-2 space-y-1">
      <button data-page="chat" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-comment"></i> Chat</button>
      <button data-page="image" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-image"></i> Image</button>
      <button data-page="video" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-video"></i> Video</button>
      <button data-page="audio" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-volume-up"></i> Audio</button>
      <button data-page="memory" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-brain"></i> Memory</button>
      <button data-page="characters" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-user-astronaut"></i> Characters</button>
      <button data-page="models" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-microchip"></i> Models</button>
      <button data-page="settings" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-cog"></i> Settings</button>
    </nav>
  </aside>

  <main id="mainContent" class="flex-1 overflow-y-auto p-4 w-full">
    <div id="pageContainer" class="max-w-6xl mx-auto"></div>
  </main>

  <script>
    // ===== CONFIGURATION (USE YOUR KEYS HERE) =====
    const VENICE_KEY = 'YOUR_VENICE_KEY_HERE'; // Replace with your actual Venice key
    const FEATHERLESS_KEY = 'YOUR_FEATHERLESS_KEY_HERE'; // Replace with your actual Featherless key

    // ===== GLOBAL STATE =====
    const store = { get(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k,v) { try { localStorage.setItem(k,v); } catch(e) {} } };
    let currentPage = 'chat';
    let currentCharacter = null; 
    let chatHistory = []; 
    let memories = JSON.parse(store.get("memories") || "[]");
    let characters = JSON.parse(store.get("characters") || "[]");

    // ===== SIDEBAR TOGGLE =====
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');
    toggleBtn.addEventListener('click', () => { sidebar.classList.toggle('-translate-x-full'); });
    document.addEventListener('click', (e) => {
      if (window.innerWidth < 1024 && !sidebar.contains(e.target) && e.target !== toggleBtn) {
        sidebar.classList.add('-translate-x-full');
      }
    });

    // ===== CORS PROXY (The secret sauce for iPhone) =====
    // We use corsproxy.io to bypass the CORS block
    const PROXY_URL = 'https://corsproxy.io/?';

    async function callAI(endpoint, provider, body) {
      let targetUrl = '';
      if (provider === 'venice') targetUrl = `https://api.venice.ai/api/v1/${endpoint}`;
      else if (provider === 'featherless') targetUrl = `https://api.featherless.ai/v1/${endpoint}`;
      else throw new Error('Unknown provider');
      
      const key = provider === 'venice' ? VENICE_KEY : FEATHERLESS_KEY;
      
      const res = await fetch(PROXY_URL + encodeURIComponent(targetUrl), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errorText = await res.text();
        throw new Error(errorText);
      }
      return res.json();
    }

    // ===== NAVIGATION =====
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPage = btn.dataset.page;
        renderPage(currentPage);
        if (window.innerWidth < 1024) sidebar.classList.add('-translate-x-full');
      });
    });

    // ===== PAGE RENDERERS =====
    function renderPage(page) {
      pageContainer.innerHTML = '';
      switch(page) {
        case 'chat': renderChat(); break;
        case 'image': renderImage(); break;
        case 'video': renderVideo(); break;
        case 'audio': renderAudio(); break;
        case 'memory': renderMemory(); break;
        case 'characters': renderCharacters(); break;
        case 'models': renderModels(); break;
        case 'settings': renderSettings(); break;
      }
    }

    // --- CHAT ---
    function renderChat() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl shadow-xl overflow-hidden flex flex-col h-[85vh]">
          <div class="p-3 border-b border-gray-700 flex flex-wrap gap-2 items-center">
            <select id="chatProvider" class="bg-gray-700 rounded px-2 py-1 text-sm"><option value="venice">Venice</option><option value="featherless">Featherless</option></select>
            <select id="chatModel" class="bg-gray-700 rounded px-2 py-1 text-sm flex-1 min-w-0">
              <option>llama-3.3-70b</option><option>uncensored</option>
            </select>
            <select id="characterSelect" class="bg-gray-700 rounded px-2 py-1 text-sm"><option value="">No Character</option></select>
            <button id="sendChatBtn" class="bg-purple-600 px-4 rounded">Send</button>
          </div>
          <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-900/50"></div>
          <div class="p-3 border-t border-gray-700 flex gap-2">
            <textarea id="chatInput" rows="1" class="flex-1 bg-gray-700 rounded p-2 resize-none" placeholder="Message..."></textarea>
          </div>
        </div>`;
      
      chatHistory.forEach(m => addMessage(m.role, m.content));
      document.getElementById('characterSelect').innerHTML = '<option value="">No Character</option>' + characters.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      document.getElementById('characterSelect').addEventListener('change', e => {
        const id = e.target.value;
        currentCharacter = characters.find(c => c.id == id) || null;
      });
      document.getElementById('sendChatBtn').addEventListener('click', sendChat);
      document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendChat(); } });
    }

    function addMessage(role, content) {
      const div = document.getElementById('chatMessages');
      const msg = document.createElement('div');
      msg.className = `flex ${role==='user'?'justify-end':'justify-start'}`;
      msg.innerHTML = `<div class="max-w-[80%] rounded-lg p-3 ${role==='user'?'bg-purple-600':'bg-gray-700'} message">${content}</div>`;
      div.appendChild(msg);
      div.scrollTop = div.scrollHeight;
    }

    async function sendChat() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      
      addMessage('user', msg);
      chatHistory.push({ role: 'user', content: msg });
      input.value = '';

      const provider = document.getElementById('chatProvider').value;
      const model = document.getElementById('chatModel').value;
      
      let messages = [];
      if (currentCharacter?.systemPrompt) messages.push({ role: 'system', content: currentCharacter.systemPrompt });
      messages.push(...chatHistory.slice(-10).map(m => ({ role: m.role, content: m.content })));

      addMessage('assistant', '⏳ Thinking...');
      const container = document.getElementById('chatMessages');
      const lastMsg = container.lastElementChild;

      try {
        const data = await callAI('chat/completions', provider, { model, messages, max_tokens: 800 });
        const reply = data.choices[0].message.content;
        chatHistory.push({ role: 'assistant', content: reply });
        lastMsg.innerHTML = `<div class="max-w-[80%] rounded-lg p-3 bg-gray-700 message">${reply}</div>`;
      } catch (err) {
        lastMsg.innerHTML = `<div class="max-w-[80%] rounded-lg p-3 bg-red-900 message">❌ ${err.message}</div>`;
      }
    }

    // --- IMAGE ---
    function renderImage() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5 grid md:grid-cols-2 gap-6">
          <div class="space-y-3">
            <select id="imgModel" class="w-full bg-gray-700 rounded p-2"><option>lustify-sdxl</option><option>flux-2-max</option></select>
            <textarea id="imgPrompt" rows="3" class="w-full bg-gray-700 rounded p-2" placeholder="Describe the image..."></textarea>
            <div class="grid grid-cols-2 gap-2">
              <select id="imgAspect" class="bg-gray-700 rounded p-2"><option>1024x1024</option><option>16:9</option></select>
            </div>
            <button id="genImageBtn" class="w-full bg-pink-600 py-2 rounded">🎨 Generate</button>
          </div>
          <div class="bg-gray-900 rounded p-3 flex flex-col items-center">
            <div id="imgResult" class="w-full min-h-[300px] bg-gray-800 rounded flex items-center justify-center text-gray-500">Image here</div>
          </div>
        </div>`;
      document.getElementById('genImageBtn').addEventListener('click', generateImage);
    }

    async function generateImage() {
      const prompt = document.getElementById('imgPrompt').value;
      const model = document.getElementById('imgModel').value;
      const size = document.getElementById('imgAspect').value;
      const [w, h] = size.includes('x') ? size.split('x').map(Number) : [1024,576];
      const resDiv = document.getElementById('imgResult');
      resDiv.innerHTML = '⏳ Generating...';
      try {
        const data = await callAI('image/generate', 'venice', {
          model, prompt, width: w, height: h, format:'webp', safe_mode: false
        });
        const b64 = data.images?.[0];
        if (b64) resDiv.innerHTML = `<img src="data:image/webp;base64,${b64}" class="rounded max-w-full max-h-96 mx-auto">`;
        else throw new Error('No image');
      } catch(e) { resDiv.innerHTML = `❌ ${e.message}`; }
    }

    // --- VIDEO ---
    function renderVideo() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5 space-y-4">
          <h2 class="text-xl font-semibold"><i class="fas fa-video"></i> Video Generation</h2>
          <textarea id="vidPrompt" rows="2" class="w-full bg-gray-700 rounded p-2" placeholder="Video description..."></textarea>
          <button id="genVideoBtn" class="bg-blue-600 px-4 py-2 rounded">🎥 Generate</button>
          <div id="vidResult" class="mt-3"></div>
        </div>`;
      document.getElementById('genVideoBtn').addEventListener('click', generateVideo);
    }

    async function generateVideo() {
      const prompt = document.getElementById('vidPrompt').value;
      const res = document.getElementById('vidResult');
      res.innerHTML = '⏳ Generating video...';
      try {
        const data = await callAI('video/generate', 'venice', { model: 'seedance-2.0', prompt });
        if (data.video_url) res.innerHTML = `<video controls class="w-full rounded"><source src="${data.video_url}" type="video/mp4"></video>`;
        else res.innerHTML = '✅ Video submitted. Check Venice dashboard.';
      } catch(e) { res.innerHTML = `❌ ${e.message}`; }
    }

    // --- AUDIO ---
    function renderAudio() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5 space-y-4">
          <h2 class="text-xl font-semibold"><i class="fas fa-volume-up"></i> Text to Speech</h2>
          <textarea id="ttsText" rows="3" class="w-full bg-gray-700 rounded p-2" placeholder="Text to speak..."></textarea>
          <button id="speakBtn" class="bg-green-600 px-4 py-2 rounded">🔊 Speak</button>
          <audio id="ttsAudio" controls class="w-full mt-3 hidden"></audio>
        </div>`;
      document.getElementById('speakBtn').addEventListener('click', async () => {
        const text = document.getElementById('ttsText').value;
        const audio = document.getElementById('ttsAudio');
        try {
          const data = await callAI('audio/speech', 'venice', { model: 'tts-1', input: text, voice: 'alloy' });
          const blob = new Blob([data], { type: 'audio/mpeg' });
          audio.src = URL.createObjectURL(blob);
          audio.classList.remove('hidden');
          audio.play();
        } catch(e) { alert(e.message); }
      });
    }

    // --- MEMORY ---
    function renderMemory() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5">
          <h2 class="text-xl font-semibold"><i class="fas fa-brain"></i> Memory</h2>
          <ul class="mt-2 space-y-1">${memories.map(m => `<li class="bg-gray-700 px-3 py-1 rounded">${m}</li>`).join('')}</ul>
        </div>`;
    }

    // --- CHARACTERS ---
    function renderCharacters() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5 space-y-4">
          <h2 class="text-xl font-semibold"><i class="fas fa-user-astronaut"></i> Characters</h2>
          <div id="characterList" class="space-y-3">${characters.map(c => `
            <div class="bg-gray-700 p-3 rounded flex justify-between items-center">
              <div><strong>${c.name}</strong></div>
              <button data-id="${c.id}" class="deleteChar text-red-400"><i class="fas fa-trash"></i></button>
            </div>`).join('')}</div>
          <div class="grid gap-2 mt-4">
            <input id="newCharName" placeholder="Name" class="bg-gray-700 rounded p-2">
            <textarea id="newCharPrompt" placeholder="System prompt" rows="2" class="bg-gray-700 rounded p-2"></textarea>
            <button id="addCharacter" class="bg-purple-600 px-4 py-1 rounded">Add Character</button>
          </div>
        </div>`;
      document.getElementById('addCharacter').addEventListener('click', () => {
        const name = document.getElementById('newCharName').value.trim();
        const prompt = document.getElementById('newCharPrompt').value.trim();
        if (name && prompt) {
          characters.push({ id: Date.now(), name, systemPrompt: prompt });
          store.set('characters', JSON.stringify(characters));
          renderCharacters();
        }
      });
      document.querySelectorAll('.deleteChar').forEach(btn => btn.addEventListener('click', e => {
        const id = e.currentTarget.dataset.id;
        characters = characters.filter(c => c.id != id);
        store.set('characters', JSON.stringify(characters));
        renderCharacters();
      }));
    }

    // --- MODELS ---
    async function renderModels() {
      pageContainer.innerHTML = `<div class="bg-gray-800 rounded-xl p-5"><h2 class="text-xl font-semibold">Models</h2><div>Loading...</div></div>`;
      try {
        const data = await callAI('models', 'venice', {});
        const models = data.data || [];
        let html = '<ul>';
        models.forEach(m => { html += `<li class="border-t border-gray-700 py-2">${m.id}</li>`; });
        html += '</ul>';
        document.querySelector('#pageContainer > div > div').innerHTML = html;
      } catch(e) { document.querySelector('#pageContainer > div > div').innerText = 'Failed to load models.'; }
    }

    // --- SETTINGS ---
    function renderSettings() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5 space-y-4">
          <h2 class="text-xl font-semibold"><i class="fas fa-cog"></i> Settings</h2>
          <p class="text-sm text-green-400">✅ Connected via CORS Proxy</p>
          <p class="text-xs text-gray-400">This works on iPhone. Add your Venice or Featherless keys in the code.</p>
        </div>`;
    }

    renderPage('chat');
  </script>
</body>
</html>
