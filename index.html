<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AI Creative Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* Ensure body/root takes full height */
    html, body { height: 100%; margin: 0; padding: 0; }
    .message { white-space: pre-wrap; word-break: break-word; }
    @media (max-width: 640px) { select, button, textarea { font-size: 16px; } }
    
    /* SIDEBAR FIXES FOR MOBILE */
    .sidebar {
      width: 260px;
      transition: transform 0.2s ease-in-out;
      z-index: 50; /* Higher z-index than content */
      background: #1a202c; /* Dark enough */
    }
    
    /* Ensure the sidebar sits OVER the content, not under it */
    .sidebar-open .sidebar {
      transform: translateX(0);
    }

    /* INPUT BOX FIX: Always visible, high z-index */
    .chat-input-container {
      position: sticky;
      bottom: 0;
      z-index: 60; /* HIGHER than the sidebar (z-50) */
      background-color: #1a202c; /* Match dark theme */
      padding: 12px;
      border-top: 1px solid #374151;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input-container textarea {
      flex: 1;
      background: #374151;
      border-radius: 8px;
      padding: 8px 12px;
      resize: none;
      min-height: 40px;
      max-height: 120px;
    }
    .chat-input-container button {
      background: #7c3aed; /* Purple */
      padding: 8px 16px;
      border-radius: 8px;
      white-space: nowrap;
    }

    /* Make sure content doesn't get covered by the sticky input */
    #chatMessages {
      padding-bottom: 80px; /* Space for the input box */
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased flex flex-col h-screen overflow-hidden">
  
  <!-- SIDEBAR TOGGLE (Fixed) -->
  <button id="sidebarToggle" class="fixed top-3 left-3 z-[70] bg-gray-800 p-2 rounded-md lg:hidden">
    <i class="fas fa-bars text-xl"></i>
  </button>

  <!-- SIDEBAR (z-50, position fixed) -->
  <aside id="sidebar" class="sidebar fixed inset-y-0 left-0 z-50 -translate-x-full transition-transform duration-200 bg-gray-900 border-r border-gray-800 flex flex-col h-screen overflow-y-auto w-64 p-4">
    <div class="mb-4">
      <h2 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">AI Studio</h2>
    </div>
    <nav class="flex-1 space-y-1">
      <button data-page="chat" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-comment"></i> Chat</button>
      <button data-page="image" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-image"></i> Image</button>
      <button data-page="video" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-video"></i> Video</button>
      <button data-page="audio" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-volume-up"></i> Audio</button>
      <button data-page="memory" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-brain"></i> Memory</button>
      <button data-page="characters" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-user-astronaut"></i> Characters</button>
      <button data-page="models" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-microchip"></i> Models</button>
      <button data-page="settings" class="nav-btn w-full text-left px-3 py-2 rounded hover:bg-gray-800 flex items-center gap-2"><i class="fas fa-cog"></i> Settings</button>
    </nav>
  </aside>

  <!-- MAIN CONTENT (Flex Column) -->
  <main id="mainContent" class="flex-1 overflow-hidden w-full flex flex-col relative z-10">
    <div id="pageContainer" class="flex-1 overflow-y-auto w-full"></div>
  </main>

  <script>
    // ===== CONFIGURATION (USE YOUR KEYS HERE) =====
    const VENICE_KEY = 'YOUR_VENICE_KEY_HERE'; 
    const FEATHERLESS_KEY = 'YOUR_FEATHERLESS_KEY_HERE';
    const PROXY_URL = 'https://corsproxy.io/?';

    // ===== GLOBAL STATE =====
    const store = { get(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }, set(k,v) { try { localStorage.setItem(k,v); } catch(e) {} } };
    let currentPage = 'chat';
    let currentCharacter = null; 
    let chatHistory = []; 
    let memories = JSON.parse(store.get("memories") || "[]");
    let characters = JSON.parse(store.get("characters") || "[]");

    // ===== SIDEBAR TOGGLE =====
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('sidebarToggle');
    const mainContent = document.getElementById('mainContent');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('-translate-x-full');
    });
    
    // Close sidebar when clicking outside (mobile)
    document.addEventListener('click', (e) => {
      if (window.innerWidth < 1024 && !sidebar.contains(e.target) && e.target !== toggleBtn) {
        sidebar.classList.add('-translate-x-full');
      }
    });

    // ===== API CALL =====
    async function callAI(endpoint, provider, body) {
      let targetUrl = '';
      if (provider === 'venice') targetUrl = `https://api.venice.ai/api/v1/${endpoint}`;
      else if (provider === 'featherless') targetUrl = `https://api.featherless.ai/v1/${endpoint}`;
      else throw new Error('Unknown provider');
      
      const key = provider === 'venice' ? VENICE_KEY : FEATHERLESS_KEY;
      
      const res = await fetch(PROXY_URL + encodeURIComponent(targetUrl), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${key}` },
        body: JSON.stringify(body)
      });
      if (!res.ok) {
        const errorText = await res.text();
        throw new Error(errorText);
      }
      return res.json();
    }

    // ===== NAVIGATION =====
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        currentPage = btn.dataset.page;
        renderPage(currentPage);
        if (window.innerWidth < 1024) sidebar.classList.add('-translate-x-full');
      });
    });

    // ===== RENDER ENGINE =====
    function renderPage(page) {
      pageContainer.innerHTML = '';
      switch(page) {
        case 'chat': renderChat(); break;
        case 'image': renderImage(); break;
        case 'video': renderVideo(); break;
        case 'audio': renderAudio(); break;
        case 'memory': renderMemory(); break;
        case 'characters': renderCharacters(); break;
        case 'models': renderModels(); break;
        case 'settings': renderSettings(); break;
      }
    }

    // --- CHAT (PROPER LAYOUT) ---
    function renderChat() {
      // The input container is SEPARATE from the messages container
      pageContainer.innerHTML = `
        <div class="flex flex-col h-full">
          <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-900/50"></div>
          <div class="chat-input-container">
            <textarea id="chatInput" rows="1" placeholder="Message..." style="min-height:40px; max-height:120px;"></textarea>
            <button id="sendChatBtn">Send</button>
          </div>
        </div>`;
      
      // Load history
      chatHistory.forEach(m => addMessage(m.role, m.content));
      
      // Setup events
      document.getElementById('sendChatBtn').addEventListener('click', sendChat);
      document.getElementById('chatInput').addEventListener('keydown', e => { 
        if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendChat(); } 
      });
    }

    function addMessage(role, content) {
      const div = document.getElementById('chatMessages');
      if (!div) return;
      const msg = document.createElement('div');
      msg.className = `flex ${role==='user'?'justify-end':'justify-start'}`;
      msg.innerHTML = `<div class="max-w-[80%] rounded-lg p-3 ${role==='user'?'bg-purple-600':'bg-gray-700'} message">${content}</div>`;
      div.appendChild(msg);
      div.scrollTop = div.scrollHeight;
    }

    async function sendChat() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      
      addMessage('user', msg);
      chatHistory.push({ role: 'user', content: msg });
      input.value = '';

      // Simulate a response (Replace this with your actual API call)
      // For now, simple echo:
      addMessage('assistant', '⏳ Thinking...');
      const container = document.getElementById('chatMessages');
      const lastMsg = container.lastElementChild;
      
      // Simplified chat logic
      setTimeout(() => {
        const reply = "I am an AI on your phone. You said: " + msg;
        chatHistory.push({ role: 'assistant', content: reply });
        lastMsg.innerHTML = `<div class="max-w-[80%] rounded-lg p-3 bg-gray-700 message">${reply}</div>`;
        document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
      }, 1000);
    }

    // --- Other Pages (Simplified for this demo) ---
    function renderImage() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5">
          <h2 class="text-xl font-semibold mb-4">Image Generation</h2>
          <p class="text-gray-400">Paste your code here to enable image generation.</p>
        </div>`;
    }
    function renderVideo() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5">
          <h2 class="text-xl font-semibold mb-4">Video Generation</h2>
          <p class="text-gray-400">Video generation coming soon.</p>
        </div>`;
    }
    function renderAudio() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5">
          <h2 class="text-xl font-semibold mb-4">Audio Generation</h2>
          <p class="text-gray-400">Text to speech coming soon.</p>
        </div>`;
    }
    function renderMemory() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5">
          <h2 class="text-xl font-semibold"><i class="fas fa-brain"></i> Memory</h2>
          <ul class="mt-2 space-y-1">${memories.map(m => `<li class="bg-gray-700 px-3 py-1 rounded">${m}</li>`).join('')}</ul>
        </div>`;
    }
    function renderCharacters() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5 space-y-4">
          <h2 class="text-xl font-semibold"><i class="fas fa-user-astronaut"></i> Characters</h2>
          <div class="space-y-3">${characters.map(c => `
            <div class="bg-gray-700 p-3 rounded flex justify-between items-center">
              <div><strong>${c.name}</strong></div>
              <button data-id="${c.id}" class="deleteChar text-red-400"><i class="fas fa-trash"></i></button>
            </div>`).join('')}</div>
          <button class="bg-purple-600 px-4 py-1 rounded">Add Character</button>
        </div>`;
    }
    function renderModels() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5">
          <h2 class="text-xl font-semibold">Models</h2>
          <div>Loading...</div>
        </div>`;
    }
    function renderSettings() {
      pageContainer.innerHTML = `
        <div class="bg-gray-800 rounded-xl p-5 space-y-4">
          <h2 class="text-xl font-semibold"><i class="fas fa-cog"></i> Settings</h2>
          <p class="text-sm text-green-400">✅ Connected via CORS Proxy</p>
        </div>`;
    }

    renderPage('chat');
  </script>
</body>
</html>
