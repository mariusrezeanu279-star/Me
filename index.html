<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AI Creative Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ===== BASE ===== */
    html, body { height: 100%; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .message { white-space: pre-wrap; word-break: break-word; }
    
    /* ===== SIDEBAR (DRAWER) ===== */
    #sidebar {
      width: 280px;
      transform: translateX(-100%); /* Hidden by default */
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 9999; /* On top of everything */
    }
    #sidebar.open { transform: translateX(0); }

    /* ===== OVERLAY ===== */
    #sidebarOverlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(0, 0, 0, 0.6);
      z-index: 9998; /* Just below the sidebar */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    #sidebarOverlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    /* ===== MAIN CONTENT ===== */
    #mainContent {
      position: relative;
      z-index: 1;
      height: 100%;
      overflow-y: auto;
      transition: filter 0.3s ease;
    }
    #mainContent.dimmed { filter: blur(2px) brightness(0.7); }

    /* ===== MOBILE INPUT FIX ===== */
    .chat-input-container {
      position: sticky;
      bottom: 0;
      z-index: 50;
      background-color: #1a202c;
      padding: 12px;
      border-top: 1px solid #374151;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .chat-input-container textarea {
      flex: 1;
      background: #374151;
      border-radius: 8px;
      padding: 8px 12px;
      resize: none;
      min-height: 40px;
      max-height: 120px;
      color: white;
    }
    .chat-input-container button {
      background: #7c3aed;
      padding: 8px 16px;
      border-radius: 8px;
      white-space: nowrap;
      color: white;
    }
    #chatMessages {
      padding-bottom: 80px; 
      min-height: 80vh;
    }
  </style>
</head>
<body class="bg-gray-950 text-gray-100 antialiased h-screen overflow-hidden">
  
  <!-- SIDEBAR TOGGLE -->
  <button id="sidebarToggle" class="fixed top-3 left-3 z-50 bg-gray-800 p-2 rounded-md lg:hidden">
    <i class="fas fa-bars text-xl text-white"></i>
  </button>

  <!-- SIDEBAR OVERLAY (Click to close) -->
  <div id="sidebarOverlay"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed inset-y-0 left-0 bg-gray-900 border-r border-gray-800 flex flex-col h-screen overflow-y-auto w-[280px] p-4 shadow-2xl">
    <div class="mb-6 pt-2">
      <h2 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">AI Studio</h2>
    </div>
    <nav class="flex-1 space-y-1">
      <button data-page="chat" class="nav-btn w-full text-left px-3 py-3 rounded hover:bg-gray-800 flex items-center gap-3 text-gray-300"><i class="fas fa-comment w-5 text-center"></i> Chat</button>
      <button data-page="image" class="nav-btn w-full text-left px-3 py-3 rounded hover:bg-gray-800 flex items-center gap-3 text-gray-300"><i class="fas fa-image w-5 text-center"></i> Image</button>
      <button data-page="video" class="nav-btn w-full text-left px-3 py-3 rounded hover:bg-gray-800 flex items-center gap-3 text-gray-300"><i class="fas fa-video w-5 text-center"></i> Video</button>
      <button data-page="audio" class="nav-btn w-full text-left px-3 py-3 rounded hover:bg-gray-800 flex items-center gap-3 text-gray-300"><i class="fas fa-volume-up w-5 text-center"></i> Audio</button>
      <button data-page="memory" class="nav-btn w-full text-left px-3 py-3 rounded hover:bg-gray-800 flex items-center gap-3 text-gray-300"><i class="fas fa-brain w-5 text-center"></i> Memory</button>
      <button data-page="characters" class="nav-btn w-full text-left px-3 py-3 rounded hover:bg-gray-800 flex items-center gap-3 text-gray-300"><i class="fas fa-user-astronaut w-5 text-center"></i> Characters</button>
      <button data-page="models" class="nav-btn w-full text-left px-3 py-3 rounded hover:bg-gray-800 flex items-center gap-3 text-gray-300"><i class="fas fa-microchip w-5 text-center"></i> Models</button>
      <button data-page="settings" class="nav-btn w-full text-left px-3 py-3 rounded hover:bg-gray-800 flex items-center gap-3 text-gray-300"><i class="fas fa-cog w-5 text-center"></i> Settings</button>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main id="mainContent" class="w-full h-full flex flex-col">
    <div id="pageContainer" class="flex-1 w-full"></div>
  </main>

  <script>
    // ===== SETUP =====
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    const mainContent = document.getElementById('mainContent');
    const toggleBtn = document.getElementById('sidebarToggle');

    function toggleSidebar(open) {
      if (open === undefined) open = !sidebar.classList.contains('open');
      sidebar.classList.toggle('open', open);
      overlay.classList.toggle('open', open);
      mainContent.classList.toggle('dimmed', open);
    }

    toggleBtn.addEventListener('click', () => toggleSidebar());
    overlay.addEventListener('click', () => toggleSidebar(false)); // Close when tapping dimmed area

    // ===== NAVIGATION =====
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        renderPage(btn.dataset.page);
        toggleSidebar(false); // Close sidebar after selection
      });
    });

    // ===== RENDER ENGINE =====
    const pageContainer = document.getElementById('pageContainer');
    let chatHistory = [];

    function renderPage(page) {
      pageContainer.innerHTML = '';
      switch(page) {
        case 'chat': renderChat(); break;
        default: 
          pageContainer.innerHTML = `<div class="p-8 text-gray-400 text-center">This feature is coming soon.</div>`;
      }
    }

    // --- CHAT ---
    function renderChat() {
      pageContainer.innerHTML = `
        <div class="flex flex-col h-full bg-gray-900">
          <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
          <div class="chat-input-container">
            <textarea id="chatInput" rows="1" placeholder="Message..." style="min-height:40px; max-height:120px;"></textarea>
            <button id="sendChatBtn">Send</button>
          </div>
        </div>`;

      // Add a placeholder message so the screen isn't empty
      const msgDiv = document.getElementById('chatMessages');
      const welcomeMsg = document.createElement('div');
      welcomeMsg.className = 'flex justify-start';
      welcomeMsg.innerHTML = `<div class="max-w-[80%] rounded-lg p-3 bg-gray-700 message">Welcome to AI Studio. Type a message to start!</div>`;
      msgDiv.appendChild(welcomeMsg);
      chatHistory.push({ role: 'assistant', content: 'Welcome to AI Studio. Type a message to start!' });

      document.getElementById('sendChatBtn').addEventListener('click', sendChat);
      document.getElementById('chatInput').addEventListener('keydown', e => { 
        if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendChat(); } 
      });
    }

    function addMessage(role, content) {
      const div = document.getElementById('chatMessages');
      if (!div) return;
      const msg = document.createElement('div');
      msg.className = `flex ${role==='user'?'justify-end':'justify-start'}`;
      msg.innerHTML = `<div class="max-w-[80%] rounded-lg p-3 ${role==='user'?'bg-purple-600':'bg-gray-700'} message">${content}</div>`;
      div.appendChild(msg);
      div.scrollTop = div.scrollHeight;
    }

    async function sendChat() {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;
      
      addMessage('user', msg);
      chatHistory.push({ role: 'user', content: msg });
      input.value = '';

      addMessage('assistant', '⏳ Thinking...');
      const container = document.getElementById('chatMessages');
      const lastMsg = container.lastElementChild;
      
      // Simulated reply
      setTimeout(() => {
        const reply = "I'm a demo mode on your iPhone. You said: " + msg;
        chatHistory.push({ role: 'assistant', content: reply });
        lastMsg.innerHTML = `<div class="max-w-[80%] rounded-lg p-3 bg-gray-700 message">${reply}</div>`;
        document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
      }, 1000);
    }

    // Start with Chat
    renderPage('chat');
  </script>
</body>
</html>
