<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>AI Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    #sidebar {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 260px;
      background: #161b22;
      border-right: 1px solid #30363d;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 1000;
      overflow-y: auto;
      padding: 16px;
    }
    #sidebar.open { transform: translateX(0); }

    /* ── Overlay ── */
    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    #overlay.open { opacity: 1; pointer-events: auto; }

    /* ── Main layout ── */
    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
    }

    /* Top bar */
    #topbar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
      z-index: 10;
    }
    #topbar h1 {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin: 0;
    }

    /* Page content area */
    #pageContent {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 12px;
    }

    /* ── Chat layout ── */
    #chatWrap {
      display: flex;
      flex-direction: column;
      height: 100%;
    }
    #chatMessages {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    #chatInputBar {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px 0 4px;
      border-top: 1px solid #30363d;
      background: #0d1117;
    }
    #chatInput {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px 12px;
      color: #e6edf3;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      line-height: 1.4;
      min-height: 42px;
      max-height: 120px;
    }
    #chatInput:focus { border-color: #7c3aed; }
    #sendBtn {
      background: #7c3aed;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      align-self: flex-end;
      height: 42px;
    }
    #sendBtn:active { background: #6d28d9; }

    /* Message bubbles */
    .msg-row { display: flex; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.assistant { justify-content: flex-start; }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user { background: #7c3aed; border-bottom-right-radius: 4px; }
    .bubble.assistant { background: #21262d; border-bottom-left-radius: 4px; }
    .bubble.error { background: #450a0a; color: #fca5a5; }
    .bubble.thinking { color: #8b949e; font-style: italic; }

    /* ── Form elements ── */
    .page-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .page-card h2 {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .field-label {
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    textarea.inp, select.inp, input.inp {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 9px 12px;
      color: #e6edf3;
      font-size: 0.9rem;
      outline: none;
      resize: none;
    }
    textarea.inp:focus, select.inp:focus, input.inp:focus { border-color: #7c3aed; }
    select.inp option { background: #0d1117; }

    .btn { border: none; border-radius: 9px; padding: 10px 16px; font-size: 0.9rem; font-weight: 600; cursor: pointer; width: 100%; }
    .btn-purple { background: #7c3aed; color: white; }
    .btn-pink   { background: #db2777; color: white; }
    .btn-blue   { background: #2563eb; color: white; }
    .btn-green  { background: #16a34a; color: white; }
    .btn-red    { background: transparent; color: #f87171; font-size: 0.8rem; width: auto; padding: 4px 8px; }
    .btn:active { opacity: 0.8; }

    .result-box {
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 10px;
      min-height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b949e;
      font-size: 0.85rem;
      padding: 12px;
      text-align: center;
    }

    /* Nav buttons */
    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: #c9d1d9;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav-btn:hover, .nav-btn.active { background: #21262d; color: #fff; }
    .nav-btn i { width: 16px; text-align: center; }

    /* Memory / char items */
    .list-item {
      background: #21262d;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Model list */
    .model-row {
      padding: 8px 0;
      border-bottom: 1px solid #21262d;
      font-size: 0.8rem;
      color: #8b949e;
    }
    .model-row strong { color: #e6edf3; font-size: 0.85rem; }

    /* Status badge */
    .badge-ok  { background: #052e16; color: #4ade80; border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; }
    .badge-err { background: #450a0a; color: #fca5a5; border-radius: 6px; padding: 6px 10px; font-size: 0.8rem; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

    /* Safe area for iPhone */
    @supports (padding-bottom: env(safe-area-inset-bottom)) {
      #chatInputBar { padding-bottom: calc(4px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>
<body>

<!-- Overlay -->
<div id="overlay"></div>

<!-- Sidebar -->
<aside id="sidebar">
  <div style="margin-bottom:20px;">
    <span style="font-size:1.1rem;font-weight:800;background:linear-gradient(90deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">AI Studio</span>
  </div>
  <nav style="display:flex;flex-direction:column;gap:2px;">
    <button class="nav-btn" data-page="chat"><i class="fas fa-comment"></i> Chat</button>
    <button class="nav-btn" data-page="image"><i class="fas fa-image"></i> Image</button>
    <button class="nav-btn" data-page="video"><i class="fas fa-video"></i> Video</button>
    <button class="nav-btn" data-page="audio"><i class="fas fa-volume-up"></i> Audio</button>
    <button class="nav-btn" data-page="memory"><i class="fas fa-brain"></i> Memory</button>
    <button class="nav-btn" data-page="characters"><i class="fas fa-user-astronaut"></i> Characters</button>
    <button class="nav-btn" data-page="models"><i class="fas fa-microchip"></i> Models</button>
    <button class="nav-btn" data-page="settings"><i class="fas fa-cog"></i> Settings</button>
  </nav>
</aside>

<!-- App shell -->
<div id="app">
  <!-- Top bar -->
  <div id="topbar">
    <button id="menuBtn" style="background:#21262d;border:none;border-radius:8px;padding:7px 10px;cursor:pointer;color:#e6edf3;flex-shrink:0;">
      <i class="fas fa-bars"></i>
    </button>
    <h1 id="pageTitle">Chat</h1>
  </div>

  <!-- Page content -->
  <div id="pageContent"></div>
</div>

<script>
// ══════════════════════════════════════════
//  KEYS — baked in permanently
// ══════════════════════════════════════════
const VENICE_KEY     = 'VENICE_INFERENCE_KEY_tn8AYsLoLSSKnrNs3EiaRqXf2uf4oYydtWSj61cC8I';
const FEATHERLESS_KEY = 'rc_65700d30a603a857d8fdbb94723748e6dee507dc2c5a8fc888356441e6d69d14';

// Venice via CORS proxy (avoids browser CORS block on github pages)
const PROXY = 'https://corsproxy.io/?url=';

// ══════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════
let chatHistory  = [];
let memories     = JSON.parse(localStorage.getItem('aistudio_memories')  || '[]');
let characters   = JSON.parse(localStorage.getItem('aistudio_chars')     || '[]');
let currentChar  = null;
let currentPage  = 'chat';

// ══════════════════════════════════════════
//  API HELPERS
// ══════════════════════════════════════════
async function venicePost(endpoint, body) {
  const url = PROXY + encodeURIComponent('https://api.venice.ai/api/v1/' + endpoint);
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + VENICE_KEY
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error('Venice error ' + res.status + ': ' + txt);
  }
  return res.json();
}

async function veniceGet(endpoint) {
  const url = PROXY + encodeURIComponent('https://api.venice.ai/api/v1/' + endpoint);
  const res = await fetch(url, {
    method: 'GET',
    headers: { 'Authorization': 'Bearer ' + VENICE_KEY }
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error('Venice error ' + res.status + ': ' + txt);
  }
  return res.json();
}

async function featherlessChat(messages) {
  const res = await fetch('https://api.featherless.ai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + FEATHERLESS_KEY
    },
    body: JSON.stringify({
      model: 'meta-llama/Llama-3.3-70B-Instruct',
      messages,
      max_tokens: 800,
      temperature: 0.7
    })
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error('Featherless error ' + res.status + ': ' + txt);
  }
  return res.json();
}

// ══════════════════════════════════════════
//  SIDEBAR
// ══════════════════════════════════════════
const sidebar  = document.getElementById('sidebar');
const overlay  = document.getElementById('overlay');
const menuBtn  = document.getElementById('menuBtn');

menuBtn.addEventListener('click', () => toggleSidebar(true));
overlay.addEventListener('click', () => toggleSidebar(false));

function toggleSidebar(open) {
  sidebar.classList.toggle('open', open);
  overlay.classList.toggle('open', open);
}

document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    toggleSidebar(false);
    renderPage(btn.dataset.page);
  });
});

// ══════════════════════════════════════════
//  ROUTER
// ══════════════════════════════════════════
const pageContent = document.getElementById('pageContent');
const pageTitle   = document.getElementById('pageTitle');

const titles = { chat:'Chat', image:'Image', video:'Video', audio:'Audio', memory:'Memory', characters:'Characters', models:'Models', settings:'Settings' };

function renderPage(page) {
  currentPage = page;
  pageTitle.textContent = titles[page] || page;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  pageContent.innerHTML = '';
  pageContent.style.padding = page === 'chat' ? '0' : '12px';
  switch (page) {
    case 'chat':       renderChat();       break;
    case 'image':      renderImage();      break;
    case 'video':      renderVideo();      break;
    case 'audio':      renderAudio();      break;
    case 'memory':     renderMemory();     break;
    case 'characters': renderCharacters(); break;
    case 'models':     renderModels();     break;
    case 'settings':   renderSettings();   break;
  }
}

// ══════════════════════════════════════════
//  CHAT
// ══════════════════════════════════════════
function renderChat() {
  pageContent.style.cssText = 'flex:1;overflow:hidden;display:flex;flex-direction:column;padding:0;';
  pageContent.innerHTML = `
    <div id="chatWrap" style="display:flex;flex-direction:column;height:100%;padding:0 12px;">
      <div id="chatMessages"></div>
      <div id="chatInputBar">
        <textarea id="chatInput" class="inp" rows="1" placeholder="Message…"></textarea>
        <button id="sendBtn" class="btn btn-purple" style="width:auto;height:42px;align-self:flex-end;">Send</button>
      </div>
    </div>`;

  // Restore history
  chatHistory.forEach(m => appendBubble(m.role, m.content));

  const input  = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  sendBtn.addEventListener('click', doSend);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
  });
  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
}

function appendBubble(role, text, extra) {
  const msgs = document.getElementById('chatMessages');
  if (!msgs) return null;
  const row = document.createElement('div');
  row.className = 'msg-row ' + role;
  const bub = document.createElement('div');
  bub.className = 'bubble ' + role + (extra ? ' ' + extra : '');
  bub.textContent = text;
  row.appendChild(bub);
  msgs.appendChild(row);
  msgs.scrollTop = msgs.scrollHeight;
  return bub;
}

async function doSend() {
  const input = document.getElementById('chatInput');
  const msg   = (input.value || '').trim();
  if (!msg) return;

  appendBubble('user', msg);
  chatHistory.push({ role: 'user', content: msg });
  input.value = '';
  input.style.height = 'auto';

  const thinkBub = appendBubble('assistant', '…thinking…', 'thinking');

  const sysPrompt = currentChar?.systemPrompt || 'You are a helpful, concise AI assistant.';
  const messages  = [{ role: 'system', content: sysPrompt }, ...chatHistory.slice(-12)];

  try {
    const data  = await featherlessChat(messages);
    const reply = data.choices[0].message.content.trim();
    chatHistory.push({ role: 'assistant', content: reply });
    if (thinkBub) { thinkBub.className = 'bubble assistant'; thinkBub.textContent = reply; }
    const msgs = document.getElementById('chatMessages');
    if (msgs) msgs.scrollTop = msgs.scrollHeight;
  } catch (e) {
    if (thinkBub) { thinkBub.className = 'bubble error'; thinkBub.textContent = '⚠ ' + e.message; }
  }
}

// ══════════════════════════════════════════
//  IMAGE
// ══════════════════════════════════════════
function renderImage() {
  pageContent.innerHTML = `
    <div class="page-card">
      <h2><i class="fas fa-image" style="color:#f472b6;"></i> Generate Image</h2>
      <div>
        <div class="field-label">Prompt</div>
        <textarea id="imgPrompt" class="inp" rows="3" placeholder="Describe the image…"></textarea>
      </div>
      <div>
        <div class="field-label">Size</div>
        <select id="imgSize" class="inp">
          <option value="1024x1024">1024 × 1024 (square)</option>
          <option value="1024x576">1024 × 576 (landscape)</option>
          <option value="576x1024">576 × 1024 (portrait)</option>
        </select>
      </div>
      <div>
        <div class="field-label">Model</div>
        <select id="imgModel" class="inp">
          <option value="flux-2-max">flux-2-max (best quality)</option>
          <option value="flux-dev">flux-dev (fast)</option>
          <option value="stable-diffusion-3.5">stable-diffusion-3.5</option>
        </select>
      </div>
      <button id="genImgBtn" class="btn btn-pink">Generate Image</button>
      <div id="imgResult" class="result-box">Image will appear here</div>
    </div>`;

  document.getElementById('genImgBtn').addEventListener('click', async () => {
    const prompt = document.getElementById('imgPrompt').value.trim();
    const size   = document.getElementById('imgSize').value;
    const model  = document.getElementById('imgModel').value;
    const res    = document.getElementById('imgResult');
    if (!prompt) { res.textContent = 'Enter a prompt first.'; return; }
    const [w, h] = size.split('x').map(Number);
    res.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating…';
    try {
      const data = await venicePost('image/generate', { model, prompt, width: w, height: h, format: 'webp' });
      const b64  = data.images?.[0];
      if (b64) {
        res.innerHTML = `<img src="data:image/webp;base64,${b64}" style="max-width:100%;max-height:400px;border-radius:10px;">`;
      } else {
        throw new Error('No image in response');
      }
    } catch (e) {
      res.innerHTML = '<span style="color:#fca5a5;">⚠ ' + e.message + '</span>';
    }
  });
}

// ══════════════════════════════════════════
//  VIDEO
// ══════════════════════════════════════════
function renderVideo() {
  pageContent.innerHTML = `
    <div class="page-card">
      <h2><i class="fas fa-video" style="color:#60a5fa;"></i> Generate Video</h2>
      <div>
        <div class="field-label">Prompt</div>
        <textarea id="vidPrompt" class="inp" rows="3" placeholder="Describe the video scene…"></textarea>
      </div>
      <div>
        <div class="field-label">Model</div>
        <select id="vidModel" class="inp">
          <option value="seedance-2.0">seedance-2.0</option>
          <option value="wan-2.1">wan-2.1</option>
        </select>
      </div>
      <button id="genVidBtn" class="btn btn-blue">Generate Video</button>
      <div id="vidResult" class="result-box">Video will appear here (30–90s)</div>
    </div>`;

  document.getElementById('genVidBtn').addEventListener('click', async () => {
    const prompt = document.getElementById('vidPrompt').value.trim();
    const model  = document.getElementById('vidModel').value;
    const res    = document.getElementById('vidResult');
    if (!prompt) { res.textContent = 'Enter a prompt first.'; return; }
    res.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating… (this takes 30–90s)';
    try {
      const data = await venicePost('video/generate', { model, prompt });
      if (data.video_url) {
        res.innerHTML = `<video controls style="width:100%;border-radius:10px;"><source src="${data.video_url}"></video>`;
        return;
      }
      if (data.video_id) {
        res.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing… polling for result';
        for (let i = 0; i < 24; i++) {
          await new Promise(r => setTimeout(r, 4000));
          const s = await venicePost('video/status', { video_id: data.video_id });
          if (s.status === 'completed' && s.video_url) {
            res.innerHTML = `<video controls style="width:100%;border-radius:10px;"><source src="${s.video_url}"></video>`;
            return;
          }
          if (s.status === 'failed') { res.innerHTML = '<span style="color:#fca5a5;">⚠ Generation failed.</span>'; return; }
          res.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Polling… attempt ' + (i+1) + '/24';
        }
        res.innerHTML = '<span style="color:#fbbf24;">⌛ Timed out. Check Venice dashboard.</span>';
      } else {
        throw new Error('Unexpected response from Venice');
      }
    } catch (e) {
      res.innerHTML = '<span style="color:#fca5a5;">⚠ ' + e.message + '</span>';
    }
  });
}

// ══════════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════════
function renderAudio() {
  pageContent.innerHTML = `
    <div class="page-card">
      <h2><i class="fas fa-volume-up" style="color:#4ade80;"></i> Text to Speech</h2>
      <div>
        <div class="field-label">Text</div>
        <textarea id="ttsText" class="inp" rows="4" placeholder="Type something to speak…"></textarea>
      </div>
      <div>
        <div class="field-label">Voice</div>
        <select id="ttsVoice" class="inp">
          <option value="alloy">Alloy (neutral)</option>
          <option value="echo">Echo (male)</option>
          <option value="fable">Fable (expressive)</option>
          <option value="onyx">Onyx (deep)</option>
          <option value="nova">Nova (female)</option>
          <option value="shimmer">Shimmer (soft)</option>
        </select>
      </div>
      <button id="ttsBtn" class="btn btn-green">Speak</button>
      <div id="ttsResult" class="result-box">Audio will appear here</div>
    </div>`;

  document.getElementById('ttsBtn').addEventListener('click', async () => {
    const text  = document.getElementById('ttsText').value.trim();
    const voice = document.getElementById('ttsVoice').value;
    const res   = document.getElementById('ttsResult');
    if (!text) { res.textContent = 'Enter some text first.'; return; }
    res.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Generating audio…';
    try {
      // Venice TTS returns raw binary audio — use fetch directly (no JSON parse)
      const url = PROXY + encodeURIComponent('https://api.venice.ai/api/v1/audio/speech');
      const r   = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + VENICE_KEY },
        body: JSON.stringify({ model: 'tts-kokoro', input: text, voice })
      });
      if (!r.ok) { throw new Error('TTS error ' + r.status + ': ' + await r.text()); }
      const blob    = await r.blob();
      const objURL  = URL.createObjectURL(blob);
      res.innerHTML = `<audio controls style="width:100%;" src="${objURL}"></audio>`;
    } catch (e) {
      res.innerHTML = '<span style="color:#fca5a5;">⚠ ' + e.message + '</span>';
    }
  });
}

// ══════════════════════════════════════════
//  MEMORY
// ══════════════════════════════════════════
function renderMemory() {
  const list = memories.length
    ? memories.map((m, i) => `<div class="list-item">${m}<button class="btn btn-red" onclick="delMemory(${i})"><i class="fas fa-times"></i></button></div>`).join('')
    : '<div style="color:#8b949e;font-size:0.85rem;">No memories saved yet.</div>';
  pageContent.innerHTML = `
    <div class="page-card">
      <h2><i class="fas fa-brain" style="color:#a78bfa;"></i> Memory</h2>
      <div style="display:flex;flex-direction:column;gap:6px;" id="memList">${list}</div>
      <div style="display:flex;gap:8px;margin-top:4px;">
        <input id="memInput" class="inp" placeholder="Add a memory…" style="flex:1;">
        <button class="btn btn-purple" style="width:auto;padding:0 14px;" onclick="addMemory()">Add</button>
      </div>
      <button class="btn btn-red" style="margin-top:4px;" onclick="clearMemories()">Clear all memories</button>
    </div>`;
}

function addMemory() {
  const v = (document.getElementById('memInput').value || '').trim();
  if (!v) return;
  memories.push(v);
  localStorage.setItem('aistudio_memories', JSON.stringify(memories));
  renderMemory();
}
function delMemory(i) {
  memories.splice(i, 1);
  localStorage.setItem('aistudio_memories', JSON.stringify(memories));
  renderMemory();
}
function clearMemories() {
  memories = [];
  localStorage.setItem('aistudio_memories', JSON.stringify(memories));
  renderMemory();
}

// ══════════════════════════════════════════
//  CHARACTERS
// ══════════════════════════════════════════
function renderCharacters() {
  const list = characters.length
    ? characters.map((c, i) => `
        <div class="list-item" style="flex-direction:column;align-items:flex-start;gap:4px;">
          <div style="display:flex;justify-content:space-between;width:100%;align-items:center;">
            <strong>${c.name}</strong>
            <div style="display:flex;gap:6px;">
              <button class="btn btn-purple" style="width:auto;padding:4px 10px;font-size:0.75rem;" onclick="selectChar(${i})">${currentChar?.id===c.id?'✓ Active':'Use'}</button>
              <button class="btn btn-red" onclick="delChar(${i})"><i class="fas fa-trash"></i></button>
            </div>
          </div>
          <div style="font-size:0.75rem;color:#8b949e;white-space:pre-wrap;">${c.systemPrompt.slice(0,120)}${c.systemPrompt.length>120?'…':''}</div>
        </div>`).join('')
    : '<div style="color:#8b949e;font-size:0.85rem;">No characters yet.</div>';

  pageContent.innerHTML = `
    <div class="page-card">
      <h2><i class="fas fa-user-astronaut" style="color:#f472b6;"></i> Characters</h2>
      <div style="display:flex;flex-direction:column;gap:8px;" id="charList">${list}</div>
      <hr style="border-color:#30363d;margin:4px 0;">
      <div class="field-label">New character</div>
      <input id="charName" class="inp" placeholder="Name">
      <textarea id="charPrompt" class="inp" rows="3" placeholder="System prompt (personality, role, instructions…)"></textarea>
      <button class="btn btn-purple" onclick="addChar()">Add Character</button>
      ${currentChar ? `<button class="btn btn-red" onclick="clearChar()">Clear active character</button>` : ''}
    </div>`;
}

function addChar() {
  const name   = (document.getElementById('charName').value   || '').trim();
  const prompt = (document.getElementById('charPrompt').value || '').trim();
  if (!name || !prompt) return;
  characters.push({ id: Date.now(), name, systemPrompt: prompt });
  localStorage.setItem('aistudio_chars', JSON.stringify(characters));
  renderCharacters();
}
function delChar(i) {
  if (currentChar?.id === characters[i].id) currentChar = null;
  characters.splice(i, 1);
  localStorage.setItem('aistudio_chars', JSON.stringify(characters));
  renderCharacters();
}
function selectChar(i) {
  currentChar = characters[i];
  renderCharacters();
}
function clearChar() {
  currentChar = null;
  renderCharacters();
}

// ══════════════════════════════════════════
//  MODELS
// ══════════════════════════════════════════
async function renderModels() {
  pageContent.innerHTML = `
    <div class="page-card">
      <h2><i class="fas fa-microchip" style="color:#60a5fa;"></i> Venice Models</h2>
      <div id="modelList" style="color:#8b949e;font-size:0.85rem;"><i class="fas fa-spinner fa-spin"></i> Loading…</div>
    </div>`;
  try {
    const data   = await veniceGet('models');
    const models = data.data || [];
    if (!models.length) { document.getElementById('modelList').textContent = 'No models returned.'; return; }
    document.getElementById('modelList').innerHTML = models.map(m => `
      <div class="model-row">
        <strong>${m.id}</strong>
        <span style="float:right;font-size:0.75rem;color:${m.type==='image'?'#f472b6':m.type==='audio'?'#4ade80':m.type==='video'?'#60a5fa':'#a78bfa'};">${m.type||'text'}</span>
        ${m.privacy ? `<div style="font-size:0.72rem;">${m.privacy}</div>` : ''}
      </div>`).join('');
  } catch (e) {
    document.getElementById('modelList').innerHTML = '<span style="color:#fca5a5;">⚠ ' + e.message + '</span>';
  }
}

      <div class="badge-ok" style="margin-top:6px;">✅ Featherless key active: …${FEATHERLESS_KEY.slice(-8)}</div>
      <div style="font-size:0.8rem;color:#8b949e;margin-top:8px;">
        Keys are baked into the HTML file. To update them, open the file in a text editor and replace the values in the <code style="color:#a78bfa;">VENICE_KEY</code> and <code style="color:#a78bfa;">FEATHERLESS_KEY</code> constants at the top of the &lt;script&gt; block.
      </div>
      <hr style="border-color:#30363d;">
      <div style="font-size:0.85rem;font-weight:600;">Chat model</div>
      <div style="font-size:0.8rem;color:#8b949e;">Featherless → meta-llama/Llama-3.3-70B-Instruct</div>
      <div style="font-size:0.85rem;font-weight:600;margin-top:8px;">Image models</div>
      <div style="font-size:0.8rem;color:#8b949e;">Venice → flux-2-max, flux-dev, stable-diffusion-3.5</div>
      <div style="font-size:0.85rem;font-weight:600;margin-top:8px;">TTS model</div>
      <div style="font-size:0.8rem;color:#8b949e;">Venice → tts-kokoro</div>
      <button class="btn" style="background:#21262d;margin-top:12px;font-size:0.8rem;" onclick="if(confirm('Clear all local data?')){localStorage.clear();location.reload();}">🗑 Clear all local data</button>
    </div>`;
}

// ══════════════════════════════════════════

renderPage('chat');
</script>
